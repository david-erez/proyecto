services:

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - proyecto-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend-react
    ports:
      - "80"
    depends_on:
      - backend
    networks:
      - proyecto-network

  backend:
    build:
      context: ./backend
    container_name: backend-go
    ports:
      - "8080"
    depends_on:
      - mongodb
    networks:
      - proyecto-network

  mongodb:
    image: mongo:8
    container_name: mongodb
    volumes:
      - mongo_data:/data/db
    networks:
      - proyecto-network

networks:
  proyecto-network:
    driver: bridge

volumes:
  mongo_data:
